<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Penumpang - Bima Trans</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        primary: '#dc2626', 
                        secondary: '#991b1b' 
                    } 
                } 
            } 
        }
    </script>
</head>
<body class="h-screen w-full bg-cover bg-center flex items-center justify-center p-4 relative" style="background-image: url('https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?q=80&w=2069&auto=format&fit=crop');">
    
    <div class="absolute inset-0 bg-black/50"></div>

    <div class="relative z-10 w-full max-w-md bg-white p-8 md:p-10 rounded-2xl shadow-2xl">
        
        <div class="text-center mb-8">
            <i class="fa-solid fa-bus text-4xl text-primary mb-3"></i>
            <h1 class="text-2xl font-bold text-gray-800 mb-1">Bima Trans</h1>
            <p class="text-gray-500 text-sm">Sistem Tiket Bus Online</p>
        </div>

        <form class="space-y-5" onsubmit="handleUserLogin(event)">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Username / Email</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-3.5 text-gray-400"></i>
                    <input type="text" required 
                        class="w-full border border-gray-300 p-3 pl-12 rounded-xl outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition" 
                        placeholder="Masukkan username">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-3.5 text-gray-400"></i>
                    <input type="password" required 
                        class="w-full border border-gray-300 p-3 pl-12 rounded-xl outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition" 
                        placeholder="Masukkan password">
                </div>
            </div>

            <button type="submit" 
                class="block w-full bg-primary text-white text-center py-3.5 rounded-xl font-bold shadow-lg shadow-red-500/30 hover:bg-secondary transition-all transform active:scale-95 mt-6">
                Masuk Sekarang <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            Belum punya akun? 
            <a href="register.html" class="text-primary font-bold hover:underline transition-colors">Daftar Sekarang</a>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-100 text-center">
            <a href="admin-login.html" class="text-xs text-gray-400 hover:text-gray-600 transition-colors">
                <i class="fa-solid fa-shield-halved mr-1"></i> Login sebagai Administrator
            </a>
        </div>
    </div>

    <script>
        function handleUserLogin(event) {
            event.preventDefault();
            // Arahkan langsung ke dashboard user
            window.location.href = "dashboard-user.html"; 
        }
    </script>
</body>
</html>
