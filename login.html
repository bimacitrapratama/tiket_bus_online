<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Tiket Bus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen flex justify-center items-center p-4">
    <div class="musim-semi-card border-api-biru p-8 rounded-2xl shadow-lg w-full max-w-md">
        <div class="text-center mb-6 relative">
            <i class="fa-solid fa-bus text-blue-500 text-4xl mb-2 api-biru relative z-10"></i>
            <h2 class="text-2xl font-bold text-blue-900">Selamat Datang Kembali</h2>
            <p class="text-sm text-blue-600">Login untuk melanjutkan pemesanan</p>
        </div>
        
        <form data-action="Login" action="dashboard.html" class="flex flex-col gap-4">
            <div>
                <label class="text-blue-800 font-semibold text-sm">Email / Username</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3 top-3 text-blue-400"></i>
                    <input type="text" required class="w-full pl-10 pr-3 py-2 border border-blue-300 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div>
                <label class="text-blue-800 font-semibold text-sm">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-3 text-blue-400"></i>
                    <input type="password" required class="w-full pl-10 pr-3 py-2 border border-blue-300 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <button type="submit" class="btn-api-biru text-white py-2 rounded-lg font-bold mt-2 flex justify-center items-center gap-2">
                Login <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </form>
        
        <p class="mt-4 text-center text-sm text-blue-700">Belum punya akun? <a href="register.html" class="text-blue-600 font-bold hover:underline">Daftar sekarang</a></p>
        <div class="mt-4 text-center"><a href="index.html" class="text-xs text-blue-500 hover:underline"><i class="fa-solid fa-arrow-left"></i> Kembali</a></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
