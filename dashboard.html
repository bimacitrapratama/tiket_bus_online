<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Pemesanan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen text-blue-900 p-4 md:p-8">
    <nav class="flex justify-between items-center bg-white/80 backdrop-blur-md p-4 rounded-xl border-api-biru shadow-md mb-8 max-w-5xl mx-auto">
        <div class="font-bold text-xl flex items-center gap-2">
            <i class="fa-solid fa-bus-simple api-biru"></i> E-Ticketing
        </div>
        <div class="flex gap-4 items-center">
            <span class="text-sm font-semibold hidden md:block">🌸 Halo, Penumpang!</span>
            <a href="index.html" class="text-red-500 hover:text-red-700 text-sm font-bold"><i class="fa-solid fa-power-off"></i> Logout</a>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto musim-semi-card border-api-biru p-6 md:p-10 rounded-2xl shadow-lg relative">
        <div class="absolute top-4 right-4 text-3xl opacity-20">🍃</div>
        <h2 class="text-2xl font-bold mb-6 border-b border-blue-200 pb-2"><i class="fa-solid fa-ticket api-biru"></i> Pesan Tiket Bus</h2>
        
        <form data-action="Pemesanan" action="payment.html" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="col-span-1 md:col-span-2">
                <label class="block text-blue-800 font-semibold mb-2">Pilih Rute <i class="fa-solid fa-map-location-dot text-blue-400"></i></label>
                <select class="w-full p-3 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white shadow-sm">
                    <option>Palembang - Jakarta</option>
                    <option>Palembang - Bandung</option>
                    <option>Palembang - Padang</option>
                </select>
            </div>
            
            <div>
                <label class="block text-blue-800 font-semibold mb-2">Tanggal Keberangkatan <i class="fa-regular fa-calendar text-blue-400"></i></label>
                <input type="date" required class="w-full p-3 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white shadow-sm">
            </div>
            
            <div>
                <label class="block text-blue-800 font-semibold mb-2">Pilih Kursi <i class="fa-solid fa-chair text-blue-400"></i></label>
                <select class="w-full p-3 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white shadow-sm">
                    <option>Kursi 1A</option>
                    <option>Kursi 1B</option>
                    <option>Kursi 2A</option>
                </select>
            </div>

            <div class="col-span-1 md:col-span-2 mt-4 bg-blue-50/80 p-4 rounded-lg border border-blue-100 flex justify-between items-center text-lg font-bold">
                <span>Total Harga:</span>
                <span class="api-biru">Rp 350.000</span>
            </div>

            <div class="col-span-1 md:col-span-2 flex justify-end mt-2">
                <button type="submit" class="btn-api-biru text-white px-8 py-3 rounded-xl font-bold text-lg flex items-center gap-2">
                    Lanjut Pembayaran <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
